name: Build POCO X6 Pro (duchamp) Hardware Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Export NDK Environment Variables
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build patchelf zip

      - name: Build FOD Shim & Icon Init
        run: |
          chmod +x src/fod/build.sh
          set +e
          ./src/fod/build.sh > build_fod.log 2>&1
          EXIT_CODE=$?
          cat build_fod.log
          if [ $EXIT_CODE -ne 0 ]; then
            MSG=$(head -n 20 build_fod.log | tr '\n' ' ')
            echo "::error title=FOD_BUILD_FAILED::$MSG"
            exit $EXIT_CODE
          fi
          mkdir -p out/vendor/lib64 out/system/bin
          cp src/fod/build/libitachi_fp_duchamp.so out/vendor/lib64/
          cp src/fod/build/itachi_icon_init out/system/bin/

      - name: Upload Debug Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_fod.log

      - name: Build Sensor HAL (MT6897)
        run: |
          chmod +x src/sensor/build.sh
          set +e
          ./src/sensor/build.sh > build_sensor.log 2>&1
          EXIT_CODE=$?
          cat build_sensor.log
          if [ $EXIT_CODE -ne 0 ]; then
            MSG=$(head -n 20 build_sensor.log | tr '\n' ' ')
            echo "::error title=SENSOR_BUILD_FAILED::$MSG"
            exit $EXIT_CODE
          fi
          mkdir -p out/vendor/lib64/hw
          cp src/sensor/build/sensors.mt6897.so out/vendor/lib64/hw/

      - name: Build AOD Native Daemon (Rust)
        run: |
          LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
          if [ ! -f "$LINKER" ]; then
            LINKER="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            export RUSTFLAGS="-C linker=$LINKER -C link-arg=--target=aarch64-linux-android34"
          else
            export RUSTFLAGS="-C linker=$LINKER"
          fi
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER"
          export CC_aarch64_linux_android="$LINKER"
          echo "Using NDK Linker: $LINKER"
          cd src/aod
          cargo build --release --target aarch64-linux-android
          cd ../..
          cp src/aod/target/aarch64-linux-android/release/itachi_aodd out/system/bin/

      - name: Package Output Artifacts
        run: |
          mkdir -p out/vendor/etc/init out/system/etc/init
          cp src/fod/itachi_fp_duchamp.rc out/vendor/etc/init/
          cp src/aod/itachi_aodd.rc out/system/etc/init/
          mkdir -p package
          cp -r out/* package/
          cp bake_into_rom.sh package/
          cp -r sepolicy package/
          chmod +x package/bake_into_rom.sh
          cd package && zip -r ../itachi-duchamp-poco-x6-pro-suite.zip . && cd ..

      - name: Upload Built Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: itachi-duchamp-poco-x6-pro-suite
          path: itachi-duchamp-poco-x6-pro-suite.zip
